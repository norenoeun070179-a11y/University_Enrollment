services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      
    ports:
      - "3001:3001"

    env_file: .env

    environment:
      DB_HOST: db
      DB_PORT: 5432
  
    container_name: app-node

    depends_on:
      - db

    volumes:
      - ./:/app
      - /app/node_modules

    working_dir: /app
    command: npm run dev

  db:
    image: postgres:17
    container_name: postgres-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: mydb

    ports:
      - "5433:5432"

    volumes:
      - db-data:/var/lib/postgresql/data
volumes:
  db-data:

